version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: honeychain
      POSTGRES_USER: honeychain
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeychain -d honeychain"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      PORT: 8000
      DATABASE_URL: postgresql://honeychain:change_me@db:5432/honeychain
      JWT_SECRET: dev-secret-change-me
      HONEYCHAIN_SECRET_KEY: dev-secret-change-me
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
