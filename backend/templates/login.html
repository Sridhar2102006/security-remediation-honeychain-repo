<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HoneyChain Demo Login</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: linear-gradient(135deg, #063b3b, #f7f9f5 58%); color: #122; min-height: 100vh; }
      .wrap { max-width: 470px; margin: 56px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 14px 35px rgba(0,0,0,0.18); }
      .brand { color: #f2b632; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; font-weight: 700; }
      h1 { margin: 8px 0 4px; color: #164b3b; font-size: 2.2rem; }
      .subtitle { color: #50605a; margin-top: 0; }
      label { display: block; margin-top: 14px; font-weight: 600; }
      input, select, button { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 11px 12px; border-radius: 8px; border: 1px solid #c9d4c8; background: white; }
      button { background: #254d2d; color: white; border: none; cursor: pointer; }
      .status { margin-top: 12px; min-height: 24px; color: #7d1d1d; }
      .info { margin-top: 18px; font-size: 0.9rem; color: #465; background: #f2f7ef; padding: 12px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Secure • transparent • tamper-evident</div>
      <h1>HoneyChain</h1>
      <p class="subtitle">Supply-chain traceability and PBFT consensus demo</p>
      <form id="loginForm">
        <label for="designation">Designation</label>
        <select id="designation" name="designation" required>
          <option value="">Choose your network role</option>
          <option value="admin">KVIC / Network Administrator</option>
          <option value="beekeeper">Beekeeper</option>
          <option value="processor">Processor</option>
          <option value="quality_lab">Quality Lab</option>
          <option value="distributor">Distributor</option>
          <option value="retailer">Retailer</option>
          <option value="consumer">Consumer</option>
        </select>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Log in</button>
      </form>
      <div id="status" class="status"></div>
      <div class="info">
        Demo credentials should be set via environment variables such as HONEYCHAIN_BEEKEEPER_PASSWORD.
      </div>
    </div>
    <script>
      const form = document.getElementById('loginForm');
      const status = document.getElementById('status');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = 'Signing in...';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const designation = document.getElementById('designation').value;
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password, designation })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          window.location.href = '/dashboard';
          return;
        }
        status.textContent = data.error || 'Login failed';
      });
    </script>
  </body>
</html>
