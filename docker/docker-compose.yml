
services:
  honeychain-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HONEYCHAIN_DB_PATH: /tmp/honeychain.sqlite3
      VERIFICATION_URL: https://example.invalid/verify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
